l_english:
amer_news.19.t:0 "[ROOT.GetName] Attacks USA." 
 amer_news.19.desc:0 "\n[ROOT.GetName] Has attacked the USA in an unprovoked act of aggression. The US Congress has vowed all out war on Maryland"
 amer_news.19.a:0 "Oh snap."
 amer_news.19.b:0 "BRING IT"
  amer_news.18.t:0 "[ROOT.GetName] Failed Attempt on US Capital." 
 amer_news.18.desc:0 "\n[ROOT.GetName] blundered an attempt to grab power and attack Washington DC. The US Congress has vowed to strip Maryland of statehood and take direct control of the state"
 amer_news.18.a:0 "Ha! Serves them right"
 amer_news.18.b:0 "Wait. They can do that?"
 amer_news.17.t:0 "[ROOT.GetName] Captures US Capital." 
 amer_news.17.desc:0 "\nAfter capturing Washington DC, Loyal members of the state's armed forces have vowed to restore order in the state. A civil war in Maryland seems unavoidable"
 amer_news.17.a:0 "Oh this just got goooood"
 amer_news.17.b:0 "Uh oh.."
  amer_news.16.t:0 "[ROOT.GetName] Captures USA." 
 amer_news.16.desc:0 "\nAfter capturing Washington DC, The President, Vice President, Cabinet, and  all of congress Maryland has in effect annexed the USA"
 amer_news.16.a:0 "Uh oh.."
 amer_news.16.b:0 "VICTORY"
  amer_news.15.t:0 "Projection: \"[ROOT.GetName] Federalist Constitution\" to fail ratification vote "
 amer_news.15.desc:0 "\nWith 93.87% of percents reporting, our election room decision team can now project that vote to ratify the so called\"[ROOT.GetName] Federalist Constitution\" has failed to pass in a sufficient number of states and will not be adopted.\nThe heavily [ROOT.GetRulingParty] leading document was controversial from the start and failed to ever gain widespread support.\n[ROOT.GetLeader] questioned the legitimacy of the results citing various unverified claims of irregularity and vowing an in depth investigation hours before the [ROOT.GetName] deligation abruptly withdrew from the provisional delegation in Washington DC."
 amer_news.15.a:0 "and so it goes on..."
  amer_news.14.t:0 "Projection: \"[ROOT.GetName] Federalist Constitution\" ratified "
 amer_news.14.desc:0 "\nWith 99.87% of percents reporting, our America decides, decision desk can now project that vote to ratify the so called\"[ROOT.GetName] Federalist [ROOT.GetRulingParty] Constitution\" has passed in all states, unifying the country under one national government, ending the second American civil war, and unifying the armed forces.\n[ENG.GetName], [FRA.GetName], and [GER.GetName] have all issues statements recognizing the legitimacy of the new government and establishing formal diplomatic relations."
 amer_news.14.a:0 "The World Just Got Another Major Player"
 amer_news.12.t:0 "[ROOT.GetName] has assassinated a world leader"
 amer_news.12.desc:0 "In a brazen attack, commandos from [ROOT.GetName] carried out a cold blooded and violent assassination in broad daylight that also killed a squad of bodyguards, a driver, 25 police officers, and 147 innocent bystanders and injured hundreds more"
 amer_news.12.a:0 "wow"
 amer_news.13.t:0 "[ROOT.GetName] \"Kill Team\" Thwarted"
 amer_news.13.desc:0 "In a brazen act, being called by many an \"of war\", a \"Kill Team\" of military commandos from the [ROOT.GetName] were apprehended while on a mission to assassinate the president! The military unit was discovered by boarder patrol agents during a random search at a boarder checkpoint."
 amer_news.13.a:0 "wow"
 amer_news.2.t:0 "U.S.A. Joins Michigan"
 amer_news.2.desc:0 "US Congress unanimously passes unification treaty with Michigan.\nPresident [USA.GetLeader] and [UMI.GetLeader] meet in [USA.Capital.GetName] today.\nAfter the event President [USA.GetLeader] said,\"Do not be confused about the character of the onslaught against us. Thanks to, Michigan, we now understand the true nature of the threat.\nMichigan spies have provided us with absolute proof that\""
 amer_news.2.a:0 "God Bless the USA!"
 amer_news.2.b:0 "We are saved! Thank God!"
 amer_news.2.c:0 "The USA will need our help! We must help them immediately"
 amer_news.2.d:0 "How foolish of them.  This might get ugly. We should prepare for the World War they are about to start."
 amer_news.1.t:0 "U.S. going to WAR"
 amer_news.1.desc:0 "The United States has announced the end of diplomatic efforts to resolve its current domestic issues peacefully. Just an hour ago the United States Congress passed the War Authorization Act. The President will be addressing the nation tonight at 8PM EST. All active and reserve service members are to immediately report to base"
 amer_news.1.a:0 "We take no joy in doing what must be done. But it must be done."
 amer_news.1.b:0 "These colors don't run."
 amer_news.1.c:0 "Oh shit"
 amer_news.3.t:0 "USA Stands Down"
 amer_news.3.desc:0 "Today the [USA.GetName] President [USA.GetLeader] announced that the USA would be disbanding and standing down its army. The president explained saying \"Nobody is forcing  us to stand down. We are doing it because it is the only moral choice. The costs in lives and propriety of our return would be devastating to our people.We must disarm and disband immediately.\""
 amer_news.3.a:0 "We had no choice."
 amer_news.3.b:0 "What happens now..."
 amer_news.3.c:0 "You know, this is a great opportunity for us to move in and take power" 
 USAEvents.1.t:0 "USA Offers Herself"
 USAEvents.1.d:0 "The United States has offered to allow us to take over the US Federal Government."
 USAEvents_option.1.a:0 "Yes! We accept.Nothing can stop us now. God Bless the USA"
 USAEvents_option.1.b:0 "No. The USA is very unpopular around these parts. We wold be hated"
 texan.1.t:0 "Texan Führer Bibb Graves DEAD"
 texan.1.d:0 "Shock across the land. Reports from Dallas confirming the death of Texas Führer and Governor for life, Supreme Führer, Führer Bibb Graves. What is know is that Graves dead, that he  was shot over six hundred times, and that he was found this way inside is Texan home. It is unclear where his security detail was when this happened, how this was allowed to happen at all and who is  responsible.  The states of Michigan, California, and Alabama are the top suspects"
 texan.1.b:0 "The world is a much safer place now."
 texan.2.d:0 "New elections are being held in Texas just 30 days after the brutal assassination of Führer Bibb Graves shocked the entire world"
 texan.2.b:0 "OK"
 texan.3.t:0 "Texan Führer Bibb Graves Attacked!"
 texan.3.d:0 "The Führer was shot at while exiting his office today. The Führer was unharmed in the botched attack. Texas Rangers swarmed the scene and arrested fifteen individuals. The criminals were swiftly executed by public executions held in Dallas."
 texan.3.b:0 "OK"
 texan.4.b:0 "OK"
 union.1.t:0 "United States Declares Mission Accomplished"
 union.1.d:0 "United States President [USA.Owner.GetLeader], addressed the nation from  [USA.Capital.GetName] today.\nPresident [USA.Owner.GetLeader] declared Mission Accomplished in the Second American Civil War hours after accepting unconditional surrenders from General Hampton of the Revelatory American Amy, General Maxim Smirnov of the Soviet American Expeditionary Force,\nThe President went on to call upon local and state governments to aid in Federal Law Enforcement activities against various criminal syndicates that have festered in the power vacuum left when the United Stated conducted a tactical retreat to London.\n Critics of the President are calling the move premature, citing the minor detail that the majority of the country remains outside of the control of US forces.\nWe asked President [USA.Owner.GetLeader] about this. The President said, \"That's about the change. The fact of the matter is, we won. The enemies has no army. We have an army. Its over. Major combat operations in the United States have concluded. Only minor civil resistance remains and only in a few key hot spots\n We will be reaching out to state governments to reintegrate them. I would like to remind those these state governments that treason is serious crime and a capital offense. We will use military force if necessary."\n
union.1.b:0 "This should be interesting..."
 amer_news.4.t:0 "U.S.A. JUSTIFIES WAR WITH [UTX.GetFactionName]"
 amer_news.4.desc:0 "President [USA.GetLeader] justified the war before congress today, saying that \"tThe situation in [UTX.GetName] is bad. The so called [UTX.GetFactionName] is tightly controlled by a [GER.GetName] backed a criminal, terrorist mad man,[UTX.GetLeader]. [UTX.GetLeader] poses a threat to the entire world and  must be brought to justice.\"\n"
 amer_news.4.a:0 "God Bless the USA"
 amer_news.4.b:0 "The USA will need our help"
 amer_news.4.c:0 "How foolish of them. FOOLS"
 amer_news.5.t:0 "U.S.A. JUSTIFIES WAR WITH [UAL.GetFactionName]"
 amer_news.5.desc:0 "President [USA.GetLeader] justified the war before congress today, saying that \"the [UAL.GetFactionName] has been hijacked by [JAP.GetName], [ITA.GerName] and [GER.GetName].\"\n"
 amer_news.5.a:0 "God Bless the USA"
 amer_news.5.b:0 "We must help them immediately"
 amer_news.5.c:0 "This might get ugly.."
 amer_news.6.t:0 "U.S.A. JUSTIFIES WAR WITH [UCA.GetFactionName]"
 amer_news.6.desc:0 "President [USA.GetLeader] justified the war before congress today, saying that \"[UCA.GetName] and the entire [UCA.GetFactionName] is nothing more than a branch of the Communist party and part of the communist [SOV.GetName] state.\n[UCA.GetName], [SOV.GetName] and the global communist threat are all one in the Same.\"\n"
 amer_news.6.a:0 "God Bless the USA"
 amer_news.6.b:0 "We must help them immediately"
 amer_news.6.c:0 "Well then..."
 amer_news.7.t:0 "WORLD RESPONDS TO [FROM.GetName] THREAT"
 amer_news.7.desc:0 "[FROM.GetLeader] has vowed rain death and destruction on a scale never before seen upon all who do not submit to [FROM.GetName] rule. [FROM.GetLeader] made it clear that a state of war now exists between the [FROM.GetName] and all non-compliant nations"
 amer_news.7.a:0 "The USA shall lead the way"
 amer_news.7.b:0 "The world stands united agonist a common threat, the  [FROM.GetName]"
 amer_news.7.c:0 "The world shall bow before [FROM.GetLeader]"
 amer_news.8.t:0 "[JAP.GetNameWithFlag] OPENS WAR ON U.S. WITH ANNEXING OF [FROM.GetNameWithFlag]"
 amer_news.8.desc:0 "\n\nJust before dawn, [JAP.GetName] soldiers entered the [FROM.GetName] state capital building in [FROM.Capital.GetName], ceasing control of the state, claiming it as part of the new [FROM.GetName] empire."
 amer_news.8.a:0 "With confidence in our armed forces, with the unbounding determination of our people, we will gain the inevitable triumph, so help us God"
 amer_news.8.b:0 "Japan may be a problem."
 amer_news.8.c:0 "NO NO NO!!!, we INVITED them! They are our FRIENDS!"
 amer_news.8.d:0 "Uh? What just happened? They INVITED us! BEGGED for our help!"
 amer_news.8.e:0 "Too far [JAP.GetName]. We must respond, war is inevitable"
 amer_news.9.t:0 "U.S.A. POLICE ACTION IN [UMI.GetName]"
 amer_news.9.desc:0 "President [USA.GetLeader] authorized what is being called a \"Policeing Action\" in [UMI.GetName]. The [UMI.GetName] leader, [UMI.GetLeader], thanked [USA.GetLeader] for his leadership ordered the Michigan Guard and Michigan Air Guard to stand down and surrender to the nearest [USA.GetName] Army personnel. No casualties were reported."
 amer_news.9.a:0 "The USA welcomes Michigan back into the Union"
 amer_news.9.b:0 "A wise choice."
 amer_news.9.c:0 "That seems a bit... aggressive."
 amer_news.10.t:0 "Soviet Union and California Merger"
 amer_news.10.desc:0 "[UCA.GetLeader] has won power in the Soviet Union, taking the reigns on the global communism movement. [UCA.GetLeader] promised to renew global efforts for revolution and promised war and death upon all who opposed this."
 amer_news.10.a:0 "Let the revolution begin!"
 amer_news.10.b:0 "A wise choice comrade."
 amer_news.10.c:0 "Uh-oh."
 amer_news.11.t:0 "Texas threatens world no more"
 amer_news.11.desc:0 "World celebrates as [UAL.GetLeader] announced that the commander of the Alabama State National Guard has accepted unconditional surrender from the of the Republic of Texas. What many had called the greatest threat to the world, is no more."
 amer_news.11.a:0 "Excellent News!"
 amer_war.0.t:0 "[FROM.GetLeader] declares himself sole ruler of all [FROM.GetFactionName]"
 amer_war.0.d:0 "\n\n[FROM.GetLeader] from now on shall be known as Dear Supreme Leader. Bow before Dear Supreme Leader! BOW! Resisting us is, pointless!"
 amer_war.0.a:0 "I bow before Dear Supreme Leader! What was mine is now yours!"
 amer_war.0.b:0 "NEVER!"
amer_war.0.c:0 "What the?!"
amer_war.0.e:0 "Uh, no thanks."
