l_english:
amer_news.19.t:0 "[ROOT.GetName] Attacks USA." 
 amer_news.19.desc:0 "\n[ROOT.GetName] Has attacked the USA in an unprovoked act of aggression. The US Congress has vowed all out war on Maryland"
 amer_news.19.a:0 "Oh snap."
 amer_news.19.b:0 "BRING IT"
  amer_news.18.t:0 "[ROOT.GetName] Failed Attempt on US Capital." 
 amer_news.18.desc:0 "\n[ROOT.GetName] blundered an attempt to grab power and attack Washington DC. The US Congress has vowed to strip Maryland of statehood and take direct control of the state"
 amer_news.18.a:0 "Ha! Serves them right"
 amer_news.18.b:0 "Wait. They can do that?"
 amer_news.17.t:0 "[ROOT.GetName] Captures US Capital." 
 amer_news.17.desc:0 "\nAfter capturing Washington DC, Loyal members of the state's armed forces have vowed to restore order in the state. A civil war in Maryland seems unavoidable"
 amer_news.17.a:0 "Oh this just got goooood"
 amer_news.17.b:0 "Uh oh.."
  amer_news.16.t:0 "[ROOT.GetName] Captures USA." 
 amer_news.16.desc:0 "\nAfter capturing Washington DC, The President, Vice President, Cabinet, and  all of congress Maryland has in effect annexed the USA"
 amer_news.16.a:0 "Uh oh.."
 amer_news.16.b:0 "VICTORY"
  amer_news.15.t:0 "Projection: \"[ROOT.GetName] Federalist Constitution\" to fail ratification vote "
 amer_news.15.desc:0 "\nWith 93.87% of percents reporting, our election room decision team can now project that vote to ratify the so called\"[ROOT.GetName] Federalist Constitution\" has failed to pass in a sufficient number of states and will not be adopted.\nThe heavily [ROOT.GetRulingParty] leading document was controversial from the start and failed to ever gain widespread support.\n[ROOT.GetLeader] questioned the legitimacy of the results citing various unverified claims of irregularity and vowing an in depth investigation hours before the [ROOT.GetName] deligation abruptly withdrew from the provisional delegation in Washington DC."
 amer_news.15.a:0 "and so it goes on..."
  amer_news.14.t:0 "Projection: \"[ROOT.GetName] Federalist Constitution\" ratified "
 amer_news.14.desc:0 "\nWith 99.87% of percents reporting, our America decides, decision desk can now project that vote to ratify the so called\"[ROOT.GetName] Federalist [ROOT.GetRulingParty] Constitution\" has passed in all states, unifying the country under one national government, ending the second American civil war, and unifying the armed forces.\n[ENG.GetName], [FRA.GetName], and [GER.GetName] have all issues statements recognizing the legitimacy of the new government and establishing formal diplomatic relations."
 amer_news.14.a:0 "The World Just Got Another Major Player"
 amer_news.12.t:0 "[event_target:american_assassination_target.GetAdjective] Leader Assassinated"
 amer_news.12.desc:0 "Commandos from [event_target:american_assassination_attacker.GetNameDef] killed the head of government of [event_target:american_assassination_target.GetNameDef] in a broad-daylight attack. A bodyguard detail, a driver, police officers, and scores of bystanders were caught in the gunfire. [event_target:american_assassination_target.GetNameDefCap] calls it murder. [event_target:american_assassination_attacker.GetNameDefCap] has offered no apology."
 amer_news.12.a:0 "The whole world heard the gunfire."
 amer_news.13.t:0 "[event_target:american_assassination_attacker.GetAdjective] Kill Team Caught"
 amer_news.13.desc:0 "Border patrol agents in [event_target:american_assassination_target.GetNameDef] stopped a military kill team sent by [event_target:american_assassination_attacker.GetNameDef] to assassinate [event_target:american_assassination_target.GetLeader]. The commandos were uncovered during a checkpoint search with weapons, forged papers, and a route to the capital. Officials in [event_target:american_assassination_target.GetNameDef] are calling the operation an act of war."
 amer_news.13.a:0 "The border guards earned their pay."
 amer_news.2.t:0 "U.S.A. Joins Michigan"
 amer_news.2.desc:0 "US Congress unanimously passes unification treaty with Michigan.\nPresident [USA.GetLeader] and [UMI.GetLeader] meet in [USA.Capital.GetName] today.\nAfter the event President [USA.GetLeader] said,\"Do not be confused about the character of the onslaught against us. Thanks to, Michigan, we now understand the true nature of the threat.\nMichigan spies have provided us with absolute proof that\""
 amer_news.2.a:0 "God Bless the USA!"
 amer_news.2.b:0 "We are saved! Thank God!"
 amer_news.2.c:0 "The USA will need our help! We must help them immediately"
 amer_news.2.d:0 "How foolish of them.  This might get ugly. We should prepare for the World War they are about to start."
 amer_news.1.t:0 "U.S. going to WAR"
 amer_news.1.desc:0 "The United States has announced the end of diplomatic efforts to resolve its current domestic issues peacefully. Just an hour ago the United States Congress passed the War Authorization Act. The President will be addressing the nation tonight at 8PM EST. All active and reserve service members are to immediately report to base"
 amer_news.1.a:0 "We take no joy in doing what must be done. But it must be done."
 amer_news.1.b:0 "These colors don't run."
 amer_news.1.c:0 "Oh shit"
 amer_news.3.t:0 "USA Stands Down"
 amer_news.3.desc:0 "Today the [USA.GetName] President [USA.GetLeader] announced that the USA would be disbanding and standing down its army. The president explained saying \"Nobody is forcing  us to stand down. We are doing it because it is the only moral choice. The costs in lives and propriety of our return would be devastating to our people.We must disarm and disband immediately.\""
 amer_news.3.a:0 "We had no choice."
 amer_news.3.b:0 "What happens now..."
 amer_news.3.c:0 "You know, this is a great opportunity for us to move in and take power" 
 USAEvents.1.t:0 "USA Offers Herself"
 USAEvents.1.d:0 "The United States has offered to allow us to take over the US Federal Government."
 USAEvents_option.1.a:0 "Yes! We accept.Nothing can stop us now. God Bless the USA"
 USAEvents_option.1.b:0 "No. The USA is very unpopular around these parts. We wold be hated"
 texan.1.t:0 "Texan Führer Bibb Graves DEAD"
 texan.1.d:0 "Shock across the land. Reports from Dallas confirm the death of Texas Führer and Governor for life, Supreme Führer Bibb Graves. Graves was found inside his Dallas home after what officials are calling a military grade assassination. His guard detail is missing, the city police are sealed in their precincts, and every faction near the capital is claiming to be the only force that can keep Texas from tearing itself apart."
 texan.1.a:0 "Seal Dallas and hunt every lead."
 texan.1.b:0 "Call elections before the army moves."
 texan.2.t:0 "Texas Calls New Elections"
 texan.2.d:0 "New elections are being held in Texas just 30 days after the brutal assassination of Führer Bibb Graves shocked the entire world. The rallies are guarded by Rangers, army patrols, and rival county deputies. Every candidate promises order; none can promise that the loser will accept the count."
 texan.2.a:0 "Let the voters decide."
 texan.2.b:0 "Keep the emergency cabinet in charge."
 texan.3.t:0 "Texan Führer Bibb Graves Attacked!"
 texan.3.d:0 "The Führer was shot at while exiting his office today. Graves was unharmed in the botched attack. Texas Rangers swarmed the scene, arrested fifteen individuals, and locked down every road out of Dallas before nightfall. The failed assassins have given the regime exactly what it wanted: a name for the enemy and a reason to strike first."
 texan.3.a:0 "Put Rangers on every road."
 texan.3.b:0 "Bring the plotters to Dallas."
 texan.4.t:0 "Dallas Under Lockdown"
 texan.4.d:0 "Dallas is quiet because Texas has made noise illegal. Rangers control the radio stations, state guardsmen hold the rail yards, and every courthouse in the capital region is working through prisoner lists faster than anyone can appeal. The old Bibb machine is dead, but its habits are not."
 texan.4.b:0 "The curfew holds."
 texan.5.t:0 "The Bibb Files"
 texan.5.d:0 "The dead Führer kept records because men like Bibb Graves always believe history will thank them. Rangers have found boxes of lists, payoffs, secret warrants, border killings, and letters from men who will deny ever meeting him. Opening the files may cleanse Texas, or it may prove that the rot had offices in every county."
 texan.5.a:0 "Read every name on the radio."
 texan.5.b:0 "Seal the boxes until Texas can breathe."
 texan.6.t:0 "The Alabama Question"
 texan.6.d:0 "Bibb's death has cracked open the old Texas-Alabama alliance. Some in Dallas want Alabama named as the hidden hand behind the killing. Others argue that the South is the one neighbor Texas cannot afford to make an enemy while the capital is still counting bodies."
 texan.6.a:0 "Send a delegation before someone sends artillery."
 texan.6.b:0 "Say what everyone in Dallas is thinking."
 texan.7.t:0 "Rangers at Every Road"
 texan.7.d:0 "Texas Rangers have asked for emergency authority to seal highways, rail yards, county airfields, and the long border roads. They say this is how Texas survives the post-Bibb panic. County sheriffs say this is how the dead man keeps ruling from the grave."
 texan.7.a:0 "Every road is a checkpoint."
 texan.7.b:0 "Watch the roads, but do not choke them."
 texan.8.t:0 "County Judges in Dallas"
 texan.8.d:0 "The county judges arrive in Dallas under armed escort, stepping over broken glass and shell casings on their way into the convention hall. They do not trust each other. They do not trust the Rangers. They do agree on one thing: if they leave without a civil plan, the army will write one for them."
 texan.8.a:0 "Let the counties rebuild the state."
 texan.8.b:0 "The capital can wait."
 texan.9.t:0 "A New Direction"
 texan.9.d:0 "The new men in Dallas do not agree on much except that the Bibb era ended in a room full of bullets. Wilbert Lee O'Daniel's people are already talking about courts, contracts, radio speeches, and quiet deals with men who still own the oil roads. Texas can look respectable again, if nobody asks how."
 texan.9.a:0 "Restore the courts first."
 texan.9.b:0 "Make the oilmen guarantee the peace."
 texan.10.t:0 "Continue the Dream"
 texan.10.d:0 "The portraits are gone from the public offices, but the files remain, the Rangers remain, and the men who learned politics under Bibb Graves still know where the phones are. They say Texas does not need a Führer. It needs the machine that made one possible."
 texan.10.a:0 "The machine survives."
 texan.10.b:0 "Rebrand it and keep moving."
 texan.11.t:0 "Free Texas"
 texan.11.d:0 "The Free Texas men do not want another capital cult, another foreign patron, or another alliance that turns county boys into someone else's army. They want a Texas that can stand alone and talk to its neighbors without kneeling. It sounds clean. It also sounds expensive."
 texan.11.a:0 "Texas stands free."
 texan.11.b:0 "Start with committees and promises."
 texan.12.t:0 "The Border Sermon"
 texan.12.d:0 "Bibb Graves has summoned cameras, Rangers, sheriffs, and a row of captured rifles to the border. The speech is already printed. Texas is under threat, the state must harden, and anyone asking for receipts is helping the enemy."
 texan.12.a:0 "Preach it from every checkpoint."
 texan.12.b:0 "Issue orders without the theater."
 texan.13.t:0 "Black-Market Receipts"
 texan.13.d:0 "The arms are arriving. The paperwork is not. Bibb's people call it creative procurement. The auditors call it a criminal supply chain with a flag on top. The generals call it Tuesday."
 texan.13.a:0 "Keep the pipeline moving."
 texan.13.b:0 "Audit enough to scare the thieves."
 texan.14.t:0 "The Alabama Wire"
 texan.14.d:0 "The direct wire to Alabama still works, which is more than anyone can say for the trust behind it. Bibb wants reassurance that the old understanding holds. His cabinet wants a warning sent before Alabama decides the Texas alliance is a trap."
 texan.14.a:0 "Keep Alabama close."
 texan.14.b:0 "Send a warning, not a handshake."
 texan.15.t:0 "Dallas Loyalty Broadcast"
 texan.15.d:0 "Every radio in Texas knows the music cue by now. Bibb Graves speaks, the announcer calls it history, and county party men write down which cafes switch the set off before the anthem ends."
 texan.15.a:0 "Put Bibb on every frequency."
 texan.15.b:0 "Keep the broadcast local."
 texan.16.t:0 "Bibb's War Cabinet"
 texan.16.d:0 "Bibb Graves has gathered generals, oil men, Rangers, radio men, and a few county bosses who know better than to sit down before he does. The map is already marked. The question is whether Texas has a war cabinet or a theater troupe with artillery."
 texan.16.a:0 "Let Bibb run the table."
 texan.16.b:0 "Make the generals sign the minutes."
 texan.17.t:0 "The Off-Books Office"
 texan.17.d:0 "The new intelligence department in Texas has a public door, a private door, and a third door nobody admits exists. Bibb's men want cash, warrants, and no questions. The Rangers want badges on every desk so the office remembers who owns the roads."
 texan.17.a:0 "Give the office cash and no questions."
 texan.17.b:0 "Put a Ranger colonel over it."
 texan.18.t:0 "Bibb Takes the Field"
 texan.18.d:0 "Bibb Graves has accepted a field marshal's baton with the same expression he uses for surrender terms. The generals applaud because the cameras are running. The staff officers quietly ask whether the war room now follows military logic, political theater, or whatever Bibb says before breakfast."
 texan.18.a:0 "Let Bibb take the field."
 texan.18.b:0 "Keep command in Dallas."
 texan.19.t:0 "The Checkpoint Map"
 texan.19.d:0 "The first border-security map looks like someone spilled nails across Texas. Highways, rail bridges, oil roads, county lines, river crossings, every one marked for a checkpoint. The Rangers call it a shield. County sheriffs call it a leash."
 texan.19.a:0 "Put the checkpoints where the Rangers want them."
 texan.19.b:0 "Let sheriffs keep some roads breathing."
 texan.20.t:0 "Dockside Inventory"
 texan.20.d:0 "The black-market arms deal has arrived in crates, tarps, false labels, and three different versions of the invoice. Bibb's men want the weapons moved before anyone learns how they got here. The accountants want one hour alone with the receipts and a locked door."
 texan.20.a:0 "Move the crates before dawn."
 texan.20.b:0 "Sort enough receipts to scare the thieves."
 american_major.1.t:0 "The Lansing Summit"
 american_major.1.d:0 "Fred W. Green has invited state delegations, frightened mayors, railroad men, union lawyers, and National Guard officers to Lansing. The promise is simple: Michigan will not conquer America, but it will keep a table open for anyone tired of choosing between occupation and apocalypse."
 american_major.1.a:0 "Put Michigan at the center of the table."
 american_major.1.b:0 "Keep the invitations quiet."
 american_major.2.t:0 "Great Lakes Safe Corridors"
 american_major.2.d:0 "Families, union locals, church caravans, and broken militia units are moving through the Great Lakes lines. Opening safe corridors wins Michigan friends and mouths to feed. Closing them keeps the peace smaller, tidier, and colder."
 american_major.2.a:0 "Open the corridors."
 american_major.2.b:0 "Keep them screened and narrow."
 american_major.3.t:0 "The Arbitration Board"
 american_major.3.d:0 "Michigan's lawyers propose an emergency arbitration board for border seizures, prisoner exchanges, missing governors, and all the little crises that become wars by Tuesday. The generals hate it. Green likes anything that makes generals wait outside the room."
 american_major.3.a:0 "Make the lawyers useful."
 american_major.3.b:0 "America is past paperwork."
 american_major.4.t:0 "Southern Governors Council"
 american_major.4.d:0 "Governor Jim Folsom has called the Southern governors into a room with maps, coffee, and no reporters. Alabama is not promising a crusade. Alabama is promising that the South will not be dragged behind Texas, California, Washington, or anyone else who mistakes panic for destiny."
 american_major.4.a:0 "The South speaks with one voice."
 american_major.4.b:0 "Keep the council informal."
 american_major.5.t:0 "The Broken Texas Alliance"
 american_major.5.d:0 "The old understanding with Texas is now a liability written in blood. Some Alabama men want the line cut clean and public. Others want a backchannel, because every Southern war starts with someone declaring that this time there will be no backchannel."
 american_major.5.a:0 "Cut the line in public."
 american_major.5.b:0 "Keep one phone working."
 american_major.6.t:0 "Alabama Guard Muster"
 american_major.6.d:0 "The Guard depots are open before sunrise. County men arrive with rifles, old uniforms, and stories about Texas, California, Washington, and traitors closer to home. Folsom can turn that fear into a shield, or let the muster stop at a warning."
 american_major.6.a:0 "Muster the Guard."
 american_major.6.b:0 "Let them stand ready."
 american_major.7.t:0 "Pacific Workers Congress"
 american_major.7.d:0 "California has called dockworkers, screenwriters, farm organizers, Soviet advisers, and party men into one congress. Upton Sinclair calls it democracy with red banners. His enemies call it a velvet rope around a firing squad."
 american_major.7.a:0 "Give the congress real work."
 american_major.7.b:0 "Let the radicals own the microphones."
 american_major.8.t:0 "Soviet Advisers at the Harbor"
 american_major.8.d:0 "More Soviet advisers have arrived under flags, fog, and speeches about friendship. They bring doctrine, technicians, and the quiet assumption that California is not merely an ally but the American front of a world revolution."
 american_major.8.a:0 "Give them offices and maps."
 american_major.8.b:0 "Keep Moscow helpful, not comfortable."
 american_major.9.t:0 "Hollywood Radio Front"
 american_major.9.d:0 "California's studios have discovered that a revolution looks better with music, clean lighting, and a voice that can make ration cards sound heroic. The new radio front can speak to the whole coast, or turn inward and make the party impossible to ignore at home."
 american_major.9.a:0 "Broadcast to the continent."
 american_major.9.b:0 "Win California first."
 american_major.10.t:0 "Texas on the Wire"
 american_major.10.d:0 "The Texas line has come alive again. Bibb Graves wants reassurance that Alabama remembers the old understanding. Folsom's staff can hear both the plea and the threat under it."
 american_major.10.a:0 "Keep the line open."
 american_major.10.b:0 "Take notes and trust nothing."
 american_major.11.t:0 "Great Lakes Staff Table"
 american_major.11.d:0 "Michigan's first war-effort meeting looks nothing like Texas or California. There are railway men, Guard officers, union lawyers, city clerks, and Fred W. Green asking everyone to speak one at a time as if America has not lost its mind."
 american_major.11.a:0 "Give the table authority."
 american_major.11.b:0 "Keep the staff work quiet."
 american_major.12.t:0 "Agricultural Mobilization Ledger"
 american_major.12.d:0 "Alabama's war effort begins with ledgers: seed, trucks, rails, Guard depots, county warehouses, and the quiet promise that no outside power will eat first while Southern families count ration tins."
 american_major.12.a:0 "Put the farms on a war footing."
 american_major.12.b:0 "Let private contracts carry it."
 american_major.13.t:0 "Three-Shift Revolution"
 american_major.13.d:0 "California's emergency production meeting has the energy of a strike vote, a film premiere, and a party purge all at once. Sinclair wants three shifts, clean slogans, and proof that the revolution can outproduce every old capital."
 american_major.13.a:0 "Make the shifts revolutionary."
 american_major.13.b:0 "Let the party control assignments."
 american_major.14.t:0 "Plainclothes Peacekeepers"
 american_major.14.d:0 "Michigan's intelligence department does not look like a secret police force. That is the point. It looks like clerks, rail inspectors, union mediators, and men in plain coats who remember which mayor lied last week."
 american_major.14.a:0 "Use them to keep the peace."
 american_major.14.b:0 "Build informant lists before the next panic."
 american_major.15.t:0 "The County Ledger Bureau"
 american_major.15.d:0 "Alabama's intelligence men begin with ledgers: who owns trucks, who hoards seed, who drinks with Texas men, who can raise fifty rifles by Sunday. Folsom does not need a spy novel. He needs the counties to tell the truth before they are forced to."
 american_major.15.a:0 "Put the counties in the books."
 american_major.15.b:0 "Let private security write the first lists."
 american_major.16.t:0 "Studio Front Desk"
 american_major.16.d:0 "California's intelligence department has desks in harbor offices, party halls, and studio buildings where nobody looks twice at a locked room. Sinclair's people say information is just another production line. Moscow's advisers nod a little too quickly."
 american_major.16.a:0 "Use the studios and the party halls."
 american_major.16.b:0 "Start with harbor files, not slogans."
 amer_news.20.t:0 "Texas Locks Down Dallas"
 amer_news.20.desc:0 "Texas authorities have sealed Dallas after the death of Bibb Graves. Rangers now control the roads, radio rooms, rail yards, and the official story. The old government insists this is temporary. The people watching the checkpoints are less sure."
 amer_news.20.a:0 "That will not stay quiet."
 amer_news.21.t:0 "Texas Calls Emergency Elections"
 amer_news.21.desc:0 "The new authorities in Texas have called emergency elections in the wake of Bibb Graves' assassination. The ballots will be watched by Rangers, county deputies, party men, and everyone with a rifle and an opinion about who really killed the Führer."
 amer_news.21.a:0 "A ballot in a powder magazine."
 amer_news.22.t:0 "Texas Opens the Bibb Files"
 amer_news.22.desc:0 "The government in Dallas has begun broadcasting documents from Bibb Graves' private files. The names already include judges, sheriffs, business leaders, and officers who believed the dead man would protect them forever."
 amer_news.22.a:0 "Turn up the radio."
 amer_news.23.t:0 "Texas Sends Delegation to Alabama"
 amer_news.23.desc:0 "Texas has sent a delegation toward Alabama in an effort to keep the old Southern relationship from collapsing after Bibb Graves' death. The delegation includes lawyers, preachers, and enough guards to suggest nobody expects a warm welcome."
 amer_news.23.a:0 "They had better drive carefully."
 amer_news.24.t:0 "Michigan Calls Lansing Summit"
 amer_news.24.desc:0 "Michigan has invited American delegations to Lansing for talks on prisoners, rail corridors, border incidents, and a possible political settlement. Fred W. Green says somebody has to keep the table standing while everyone else reaches for the matches."
 amer_news.24.a:0 "That sounds almost sane."
 amer_news.25.t:0 "Alabama Forms Southern Governors Council"
 amer_news.25.desc:0 "Governor Jim Folsom has convened the Southern Governors Council, promising that Alabama and its allies will not be dragged into another state's crisis without a vote, a plan, and a very clear enemy."
 amer_news.25.a:0 "The South is getting organized."
 amer_news.26.t:0 "Alabama Breaks with Texas"
 amer_news.26.desc:0 "Alabama has publicly distanced itself from Texas after the collapse of the Bibb Graves regime. Officials did not declare war, but they did everything short of hanging a sign on the border reading not our disaster."
 amer_news.26.a:0 "That alliance is dead."
 amer_news.27.t:0 "California Calls Pacific Workers Congress"
 amer_news.27.desc:0 "California has opened a Pacific Workers Congress, bringing dockworkers, factory committees, party officials, and foreign observers into the same hall. Chairperson Sinclair calls it the democratic engine of the revolution."
 amer_news.27.a:0 "Red banners on the coast."
 amer_news.28.t:0 "Soviet Advisers Expand California Mission"
 amer_news.28.desc:0 "California has accepted an expanded Soviet advisory mission. The public language is technical cooperation. The private fear is that the Sunshine Block is becoming the American department of Moscow's foreign policy."
 amer_news.28.a:0 "Moscow smiles."
 amer_news.29.t:0 "Texas Keeps the Bibb Machine"
 amer_news.29.desc:0 "Texas has chosen continuity after Bibb Graves. The portraits are gone, the titles are softer, and the machine remains. Dallas insists this is order. Its enemies call it a new label on the same old fist."
 amer_news.29.a:0 "New sign, same door."
 amer_news.30.t:0 "Michigan Offers Arbitration"
 amer_news.30.desc:0 "Michigan has created an emergency arbitration board for disputes among the American successor states. It has no army big enough to make everyone listen, but it does have lawyers, rail lines, and the strange advantage of not sounding insane."
 amer_news.30.a:0 "Let us see who shows up."
 amer_news.31.t:0 "California Opens Hollywood Radio Front"
 amer_news.31.desc:0 "California has turned its studios and radio towers toward the American crisis. The broadcasts mix music, ration news, worker testimony, and revolutionary theater into something that sounds halfway between a campaign speech and a movie trailer."
 amer_news.31.a:0 "The revolution has a soundtrack."
 american_usa.1.t:0 "Federal Courts in Exile"
 american_usa.1.d:0 "The United States still has judges, seals, law clerks, and file cabinets full of claims against every statehouse flying the wrong flag. The generals want targets. The lawyers want jurisdiction. The President wants both, preferably in that order."
 american_usa.1.a:0 "File the cases and publish the warrants."
 american_usa.1.b:0 "Keep the legal work classified."
 american_usa.2.t:0 "State Contact Office"
 american_usa.2.d:0 "The State Department has assembled a contact office for governors, acting governors, mayors, sheriffs, defectors, and anyone else who can answer a phone without declaring independence during the call. Amnesty is cheap. Trust is not."
 american_usa.2.a:0 "Offer a road back."
 american_usa.2.b:0 "Build the blacklist first."
 american_usa.3.t:0 "Return Bond Drive"
 american_usa.3.d:0 "Treasury men have proposed a Return Bond drive for the reconquest. Posters show flags over state capitols, smiling shipyard workers, and no mention of how many bridges the Army expects to replace on the way home."
 american_usa.3.a:0 "Sell the return."
 american_usa.3.b:0 "Sell victory."
 american_usa.4.t:0 "Homeland Threat Briefing"
 american_usa.4.d:0 "The briefing room map is covered in colored pins: Michigan blue, Texas red, Alabama green, California crimson, and Washington circled so hard the paper is tearing. The President can let the public see the danger, or keep the panic inside the building."
 american_usa.4.a:0 "Show the people the map."
 american_usa.4.b:0 "Classify the ugly parts."
 american_usa.5.t:0 "War Authorization Rooms"
 american_usa.5.d:0 "Congress has authorized force, which means every room in Washington has become a war room and every war room has three men insisting they were ready yesterday. The President can harness the panic or slow it into something that looks like government."
 american_usa.5.a:0 "Turn every room toward the war."
 american_usa.5.b:0 "Make the machinery orderly."
 american_usa.6.t:0 "Michigan Pact Office"
 american_usa.6.d:0 "The Michigan agreement has created a new kind of federal problem: an ally that wants rules in writing. Staffers are already arguing over command charts, rail priorities, and whether Lansing gets a bigger office than half the cabinet."
 american_usa.6.a:0 "Put the pact in writing."
 american_usa.6.b:0 "Win first, file later."
 american_usa.7.t:0 "Orderly Stand Down"
 american_usa.7.d:0 "The order to stand down does not make the government vanish. It creates archives, evacuation lists, sealed crates, quiet resignations, and a few officers who keep copies of everything because history has a habit of coming back with a subpoena."
 american_usa.7.a:0 "Preserve the government."
 american_usa.7.b:0 "Save the records that matter."
 american_usa.8.t:0 "The First Winter Tables"
 american_usa.8.d:0 "The first winter-prep tables are ugly: rifles short, trucks older than their drivers, state capitols outside federal reach, and a Congress that wants clean answers from dirty arithmetic. The Army can publish confidence or build the plan in a quieter room."
 american_usa.8.a:0 "Give the Army the room."
 american_usa.8.b:0 "Keep the public calm."
 american_usa.9.t:0 "The Second Winter Estimate"
 american_usa.9.d:0 "The second estimate is worse because it is more honest. Every line item now has a name attached, and every name has a senator asking why his state is not first on the return map."
 american_usa.9.a:0 "Tell them the country comes first."
 american_usa.9.b:0 "Write the sober version for Congress."
 american_usa.10.t:0 "Round-the-Clock Plants"
 american_usa.10.d:0 "The new plants do not sleep. Lights burn through the night, foremen learn military acronyms, and Treasury men discover that patriotism gets cheaper when contracts are signed in bulk."
 american_usa.10.a:0 "Run the plants until the windows glow."
 american_usa.10.b:0 "Put liaison boards over the contracts."
 american_usa.11.t:0 "No More Running"
 american_usa.11.d:0 "The last winter-prep meeting ends without anyone saying retreat. Not because the word is forbidden, but because everybody in the room knows the country has already spent its last excuse."
 american_usa.11.a:0 "No more running."
 american_usa.11.b:0 "Lock the return plans."
 amer_news.32.t:0 "United States Reopens Federal Courts"
 amer_news.32.desc:0 "The United States has reopened federal courts for claims against the breakaway state governments. Washington says the law never left. The successor states say a filing cabinet is not an army."
 amer_news.32.a:0 "The paperwork begins."
 amer_news.33.t:0 "Washington Opens State Contact Office"
 amer_news.33.desc:0 "The United States has opened a contact office for officials in the successor states willing to discuss surrender, amnesty, cooperation, or at least how not to shoot the mail truck."
 amer_news.33.a:0 "Someone will call."
 amer_news.34.t:0 "United States Launches Return Bond Drive"
 amer_news.34.desc:0 "Washington has launched a national bond campaign to fund the return to the American homeland. The posters are patriotic, the speeches are louder than the math, and the money is already moving."
 amer_news.34.a:0 "Buy bonds."
 amer_news.35.t:0 "United States Publishes Homeland Threat Map"
 amer_news.35.desc:0 "The United States has released a public threat map of the successor states, naming the major factions and warning that delay only hardens the new order. The message is simple: America is coming back."
 amer_news.35.a:0 "So it begins again."
 amer_news.36.t:0 "Bibb Graves Broadcasts from Dallas"
 amer_news.36.desc:0 "Texas leader Bibb Graves has delivered a statewide loyalty broadcast from Dallas, warning enemies at home and abroad that Texas is not confused, not afraid, and not taking attendance twice."
 amer_news.36.a:0 "That sounded like a threat."
 amer_news.37.t:0 "Texas Reopens Alabama Wire"
 amer_news.37.desc:0 "Texas has reopened direct communications with Alabama, testing whether the old relationship can survive suspicion, rival ambitions, and the simple fact that both sides are now planning for the day it fails."
 amer_news.37.a:0 "That line is hot."
 amer_news.38.t:0 "Bibb Graves Forms Texas War Cabinet"
 amer_news.38.desc:0 "Bibb Graves has announced a Texas war cabinet from Dallas, promising that every road, well, rifle, radio tower, and county courthouse will answer one command. Critics declined to provide their names."
 amer_news.38.a:0 "Texas tightens up."
 amer_news.39.t:0 "Michigan Organizes Great Lakes Staff Table"
 amer_news.39.desc:0 "Michigan has formed a Great Lakes staff table for emergency coordination among Guard officers, railroads, union officials, and state clerks. It is not glamorous. That may be why people are taking it seriously."
 amer_news.39.a:0 "Paperwork may save somebody."
 amer_news.40.t:0 "Alabama Mobilizes Southern Agriculture"
 amer_news.40.desc:0 "Alabama has begun organizing farms, depots, warehouses, and truck routes for a longer American crisis. Governor Folsom says the South will not starve while other men chase flags."
 amer_news.40.a:0 "The ledgers are open."
 amer_news.41.t:0 "California Announces Three-Shift Production"
 amer_news.41.desc:0 "California has announced a three-shift emergency production campaign, promising revolutionary output from the coast's factories, docks, studios, and party committees."
 amer_news.41.a:0 "The coast gets louder."
 amer_news.42.t:0 "Washington Turns to War Rooms"
 amer_news.42.desc:0 "Following the War Authorization Act, Washington has converted committees, agencies, and borrowed hotel floors into command rooms for the restoration campaign. The Union is improvising at scale."
 amer_news.42.a:0 "That sounds expensive."
 amer_news.43.t:0 "USA and Michigan Formalize Pact Office"
 amer_news.43.desc:0 "The United States and Michigan have opened a joint office to coordinate the new pact between Washington and Lansing. The signage is temporary. The consequences are not."
 amer_news.43.a:0 "An alliance with filing cabinets."
 union.1.t:0 "United States Declares Mission Accomplished"
 union.1.d:0 "United States President [USA.Owner.GetLeader], addressed the nation from  [USA.Capital.GetName] today.\nPresident [USA.Owner.GetLeader] declared Mission Accomplished in the Second American Civil War hours after accepting unconditional surrenders from General Hampton of the Revelatory American Amy, General Maxim Smirnov of the Soviet American Expeditionary Force,\nThe President went on to call upon local and state governments to aid in Federal Law Enforcement activities against various criminal syndicates that have festered in the power vacuum left when the United Stated conducted a tactical retreat to London.\n Critics of the President are calling the move premature, citing the minor detail that the majority of the country remains outside of the control of US forces.\nWe asked President [USA.Owner.GetLeader] about this. The President said, \"That's about the change. The fact of the matter is, we won. The enemies has no army. We have an army. Its over. Major combat operations in the United States have concluded. Only minor civil resistance remains and only in a few key hot spots\n We will be reaching out to state governments to reintegrate them. I would like to remind those these state governments that treason is serious crime and a capital offense. We will use military force if necessary."\n
union.1.b:0 "This should be interesting..."
 amer_news.4.t:0 "U.S.A. JUSTIFIES WAR WITH [UTX.GetFactionName]"
 amer_news.4.desc:0 "President [USA.GetLeader] justified the war before congress today, saying that \"tThe situation in [UTX.GetName] is bad. The so called [UTX.GetFactionName] is tightly controlled by a [GER.GetName] backed a criminal, terrorist mad man,[UTX.GetLeader]. [UTX.GetLeader] poses a threat to the entire world and  must be brought to justice.\"\n"
 amer_news.4.a:0 "God Bless the USA"
 amer_news.4.b:0 "The USA will need our help"
 amer_news.4.c:0 "How foolish of them. FOOLS"
 amer_news.5.t:0 "U.S.A. JUSTIFIES WAR WITH [UAL.GetFactionName]"
 amer_news.5.desc:0 "President [USA.GetLeader] justified the war before congress today, saying that \"the [UAL.GetFactionName] has been hijacked by [JAP.GetName], [ITA.GerName] and [GER.GetName].\"\n"
 amer_news.5.a:0 "God Bless the USA"
 amer_news.5.b:0 "We must help them immediately"
 amer_news.5.c:0 "This might get ugly.."
 amer_news.6.t:0 "U.S.A. JUSTIFIES WAR WITH [UCA.GetFactionName]"
 amer_news.6.desc:0 "President [USA.GetLeader] justified the war before congress today, saying that \"[UCA.GetName] and the entire [UCA.GetFactionName] is nothing more than a branch of the Communist party and part of the communist [SOV.GetName] state.\n[UCA.GetName], [SOV.GetName] and the global communist threat are all one in the Same.\"\n"
 amer_news.6.a:0 "God Bless the USA"
 amer_news.6.b:0 "We must help them immediately"
 amer_news.6.c:0 "Well then..."
 amer_news.7.t:0 "WORLD RESPONDS TO [FROM.GetName] THREAT"
 amer_news.7.desc:0 "[FROM.GetLeader] has vowed rain death and destruction on a scale never before seen upon all who do not submit to [FROM.GetName] rule. [FROM.GetLeader] made it clear that a state of war now exists between the [FROM.GetName] and all non-compliant nations"
 amer_news.7.a:0 "The USA shall lead the way"
 amer_news.7.b:0 "The world stands united agonist a common threat, the  [FROM.GetName]"
 amer_news.7.c:0 "The world shall bow before [FROM.GetLeader]"
 amer_news.8.t:0 "[JAP.GetNameWithFlag] OPENS WAR ON U.S. WITH ANNEXING OF [FROM.GetNameWithFlag]"
 amer_news.8.desc:0 "\n\nJust before dawn, [JAP.GetName] soldiers entered the [FROM.GetName] state capital building in [FROM.Capital.GetName], ceasing control of the state, claiming it as part of the new [FROM.GetName] empire."
 amer_news.8.a:0 "With confidence in our armed forces, with the unbounding determination of our people, we will gain the inevitable triumph, so help us God"
 amer_news.8.b:0 "Japan may be a problem."
 amer_news.8.c:0 "NO NO NO!!!, we INVITED them! They are our FRIENDS!"
 amer_news.8.d:0 "Uh? What just happened? They INVITED us! BEGGED for our help!"
 amer_news.8.e:0 "Too far [JAP.GetName]. We must respond, war is inevitable"
 amer_news.9.t:0 "U.S.A. POLICE ACTION IN [UMI.GetName]"
 amer_news.9.desc:0 "President [USA.GetLeader] authorized what is being called a \"Policeing Action\" in [UMI.GetName]. The [UMI.GetName] leader, [UMI.GetLeader], thanked [USA.GetLeader] for his leadership ordered the Michigan Guard and Michigan Air Guard to stand down and surrender to the nearest [USA.GetName] Army personnel. No casualties were reported."
 amer_news.9.a:0 "The USA welcomes Michigan back into the Union"
 amer_news.9.b:0 "A wise choice."
 amer_news.9.c:0 "That seems a bit... aggressive."
 amer_news.10.t:0 "Soviet Union and California Merger"
 amer_news.10.desc:0 "[UCA.GetLeader] has won power in the Soviet Union, taking the reigns on the global communism movement. [UCA.GetLeader] promised to renew global efforts for revolution and promised war and death upon all who opposed this."
 amer_news.10.a:0 "Let the revolution begin!"
 amer_news.10.b:0 "A wise choice comrade."
 amer_news.10.c:0 "Uh-oh."
 amer_news.11.t:0 "Texas threatens world no more"
 amer_news.11.desc:0 "World celebrates as [UAL.GetLeader] announced that the commander of the Alabama State National Guard has accepted unconditional surrender from the of the Republic of Texas. What many had called the greatest threat to the world, is no more."
 amer_news.11.a:0 "Excellent News!"
 amer_war.0.t:0 "[FROM.GetLeader] declares himself sole ruler of all [FROM.GetFactionName]"
 amer_war.0.d:0 "\n\n[FROM.GetLeader] from now on shall be known as Dear Supreme Leader. Bow before Dear Supreme Leader! BOW! Resisting us is, pointless!"
 amer_war.0.a:0 "I bow before Dear Supreme Leader! What was mine is now yours!"
 amer_war.0.b:0 "NEVER!"
amer_war.0.c:0 "What the?!"
amer_war.0.e:0 "Uh, no thanks."
