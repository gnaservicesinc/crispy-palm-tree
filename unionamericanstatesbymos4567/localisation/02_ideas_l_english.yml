l_english:
 american_isolationism_influence:0 "American Influence"
 american_isolationism_influence_desc:0 "The idea of a weak Union of powerful and independent American states very popular, and the country is susceptible to align with the America First Committee."
 american_texas_ranger_cordon:0 "Ranger Roadblocks"
 american_texas_ranger_cordon_desc:0 "The Rangers have turned the roads into checkpoints and the checkpoints into a political fact."
 american_texas_county_convention:0 "County Convention"
 american_texas_county_convention_desc:0 "County judges and local bosses have been pulled into the work of keeping Texas from breaking apart."
 american_texas_new_direction:0 "New Texas Direction"
 american_texas_new_direction_desc:0 "Texas is trying to look lawful, respectable, and open for business after Bibb Graves."
 american_texas_bibb_machine:0 "Bibb Machine Survives"
 american_texas_bibb_machine_desc:0 "The name has changed, the machine has not."
 american_texas_free_texas:0 "Free Texas Promise"
 american_texas_free_texas_desc:0 "Texas promises to stand alone, speak for itself, and kneel to no capital."
 american_texas_border_sermons:0 "Border Sermons"
 american_texas_border_sermons_desc:0 "Bibb has turned border security into a traveling revival for the state."
 american_texas_blackmarket_pipeline:0 "Black-Market Pipeline"
 american_texas_blackmarket_pipeline_desc:0 "The arms keep arriving, and nobody asks too loudly where the money went."
 american_texas_alabama_wire:0 "Alabama Direct Wire"
 american_texas_alabama_wire_desc:0 "The direct line to Alabama is open, tense, and useful."
 american_texas_loyalty_broadcast:0 "Dallas Loyalty Broadcasts"
 american_texas_loyalty_broadcast_desc:0 "Bibb's voice is on the radio, and everyone knows when to leave it on."
 american_texas_war_cabinet:0 "Bibb's War Cabinet"
 american_texas_war_cabinet_desc:0 "Texas has a war cabinet, but everybody knows whose chair matters."
 american_michigan_lansing_summit:0 "Lansing Summit"
 american_michigan_lansing_summit_desc:0 "Michigan is hosting the table everyone claims to hate and quietly needs."
 american_michigan_safe_corridors:0 "Great Lakes Safe Corridors"
 american_michigan_safe_corridors_desc:0 "Controlled routes through Michigan move people, supplies, and influence."
 american_michigan_arbitration_board:0 "American Arbitration Board"
 american_michigan_arbitration_board_desc:0 "Michigan's clerks and lawyers are trying to delay wars long enough for politics to catch up."
 american_michigan_glto_staff:0 "Great Lakes Staff Table"
 american_michigan_glto_staff_desc:0 "Michigan's emergency table is where rail schedules, Guard orders, and political restraint meet."
 american_alabama_southern_council:0 "Southern Governors Council"
 american_alabama_southern_council_desc:0 "Alabama has made the Southern Agricultural Alliance into a council with chairs, minutes, and teeth."
 american_alabama_texas_break:0 "Broken Texas Alliance"
 american_alabama_texas_break_desc:0 "The old understanding with Texas has been cut loose in public."
 american_alabama_guard_muster:0 "Alabama Guard Muster"
 american_alabama_guard_muster_desc:0 "The Guard depots are open and the counties are counting rifles."
 american_alabama_texas_wire:0 "Texas Direct Wire"
 american_alabama_texas_wire_desc:0 "Alabama keeps one line open to Texas and one hand on the receiver."
 american_alabama_agricultural_mobilization:0 "Agricultural Mobilization Ledger"
 american_alabama_agricultural_mobilization_desc:0 "Alabama is turning farms, depots, and county warehouses into the backbone of the Southern war effort."
 american_california_workers_congress:0 "Pacific Workers Congress"
 american_california_workers_congress_desc:0 "California's revolution has a hall, a microphone, and committees for everything."
 american_california_soviet_advisers:0 "Expanded Soviet Advisers"
 american_california_soviet_advisers_desc:0 "Soviet advisers are helping California plan the revolution with maps, manuals, and assumptions."
 american_california_radio_front:0 "Hollywood Radio Front"
 american_california_radio_front_desc:0 "California's studios and radio towers are now part of the political war."
 american_california_three_shift_revolution:0 "Three-Shift Revolution"
 american_california_three_shift_revolution_desc:0 "California has made emergency production into a party slogan and a factory schedule."
 american_usa_reclamation_courts:0 "Federal Reclamation Courts"
 american_usa_reclamation_courts_desc:0 "Washington's lawyers are turning restoration into warrants, claims, and public exhibits."
 american_usa_state_contact_office:0 "State Contact Office"
 american_usa_state_contact_office_desc:0 "A small office is keeping the phones open to state officials who may yet come back."
 american_usa_return_bonds:0 "Return Bonds"
 american_usa_return_bonds_desc:0 "The public is buying the return before the Army has finished planning it."
 american_usa_restoration_briefing:0 "Homeland Threat Briefing"
 american_usa_restoration_briefing_desc:0 "The public map names enemies, priorities, and the promise that America is coming back."
 american_usa_war_authorization_rooms:0 "War Authorization Rooms"
 american_usa_war_authorization_rooms_desc:0 "Washington is turning every office with a phone into part of the restoration campaign."
 american_usa_michigan_pact_office:0 "Michigan Pact Office"
 american_usa_michigan_pact_office_desc:0 "The new pact with Michigan now has staff, memos, and a door people can argue outside."
 american_usa_orderly_standdown:0 "Orderly Stand Down"
 american_usa_orderly_standdown_desc:0 "Even retreat can preserve archives, authority, and the people needed for a later return."
